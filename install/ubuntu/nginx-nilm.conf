# Reverse proxy Nginx para la Plataforma NILM Energy Analytics.
# install.sh reemplaza 'PROXYPORT' por el puerto real (por defecto 8000).
# Se instala en /etc/nginx/sites-available/nilm y se enlaza en sites-enabled.

upstream nilm_backend {
    server 127.0.0.1:PROXYPORT;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Limite de subida: los archivos Excel de medicion pueden ser grandes (~25 MB).
    client_max_body_size 100M;

    # Logs especificos de esta app.
    access_log /var/log/nginx/nilm-access.log;
    error_log  /var/log/nginx/nilm-error.log;

    location / {
        proxy_pass         http://nilm_backend;
        proxy_http_version 1.1;

        # Cabeceras para preservar informacion del cliente.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte de WebSocket / streaming (por si se anaden en el futuro).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Tiempos de espera generosos: el analisis NILM puede tardar.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
